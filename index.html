<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Showz - Local Shows & Live Music</title>
    <meta name="title" content="Showz - Local Shows & Live Music" />
    <meta name="description" content="Discover local music events, indie gigs, and concerts. Admin portal for live show managers." />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Showz" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('GigPulse ServiceWorker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.log('GigPulse ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
